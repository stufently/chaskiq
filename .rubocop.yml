inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-rails

Style/StringLiterals:
  Description: Checks if uses of quotes match the configured preference.
  StyleGuide: https://github.com/bbatsov/ruby-style-guide#consistent-string-literals
  Enabled: true
  EnforcedStyle: double_quotes
  SupportedStyles:
  - single_quotes
  - double_quotes

Style/HashSyntax:
  EnforcedShorthandSyntax: never


Rails/EnvironmentVariableAccess:
  AllowReads: true

Lint/EmptyBlock:
  Exclude:
    - 'spec/**/*'
Metrics/BlockLength:
  Exclude:
  - 'spec/**/*'

Style/OpenStructUse:
  Enabled: false
Style/AsciiComments:
  Enabled: false
Lint/MissingSuper:
  Enabled: false
Rails/SkipsModelValidations:
  Enabled: false
Metrics/ModuleLength:
  Exclude:
    - app/services/message_apis/helpers.rb
Rails/InverseOf:
  Enabled: false
# Owner decisions 2026-11-20 (docs/specs/fork-updates-rubocop-plan.md, R7, second batch):
# format tokens stay unannotated ("%s"), the style the project writes; no code uses another style.
Style/FormatStringToken:
  EnforcedStyle: unannotated
# These five plugin files stay compact (`class A::B`): nested, `Twilio` in twilio_phone/api.rb would
# resolve to MessageApis::Twilio, and the four presenters evaluate ERB templates with
# `result(binding)`, whose constants no static check sees. Nesting them is risk without gain.
Style/ClassAndModuleChildren:
  Exclude:
    - 'app/services/message_apis/article_search/presenter.rb'
    - 'app/services/message_apis/calendly/presenter.rb'
    - 'app/services/message_apis/twilio_phone/api.rb'
    - 'app/services/message_apis/twilio_phone/presenter.rb'
    - 'app/services/message_apis/ui_catalog/presenter.rb'
# GraphQL type methods resolve schema fields of the same name (`online`, `owner`, ...); a `?` name
# would change the schema.
Naming/PredicateMethod:
  Exclude:
    - 'app/graphql/types/**/*'
# PluginSchemaValidator is one validator built from 21 small schema node classes; a file per class
# would scatter it without making it clearer.
Style/OneClassPerFile:
  Exclude:
    - 'app/services/plugin_schema_validator.rb'
# Owner decision 2026-11-20 (docs/specs/fork-updates-rubocop-plan.md, R7): stub class comments
# ("# Class for X") carry no information; classes are documented where it matters (GraphQL schema,
# README, specs).
Style/Documentation:
  Enabled: false
# Owner decision 2026-11-20 (same plan, R7): get_x/set_x names are part of public interfaces
# (GraphQL resolvers, plugin and integration APIs); renaming them breaks plugins and integrations.
Naming/AccessorMethodName:
  Enabled: false
# Owner decision 2026-11-20 (same plan, R7): parameter names of public methods are kept as they are
# (short names mirror external APIs); renaming them breaks plugins and integrations.
Naming/MethodParameterName:
  Enabled: false
# Owner decision 2026-11-20 (same plan, R6): keyword argument names are part of the plugin and
# integration interfaces (callers pass them by name), so an unused keyword argument stays as it is;
# unused positional arguments get a `_` prefix instead.
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true
# R2b (same plan, owner decisions 2026-11-20): in ApiController the memoized ivars of get_user_data
# (@user_data) and get_app_user (@app_user) are state that other methods and subclasses also set and
# read (get_user_data_from_auth, set_locale, Api::GraphqlController#auth and attr_reader :user_data);
# naming them after the methods would split that state. App#availability is renamed instead.
Naming/MemoizedInstanceVariableName:
  Exclude:
    - 'app/controllers/api_controller.rb'
AllCops:
  NewCops: enable
  Exclude:
    - 'node_modules/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'script/**/*'
    - 'bin/{rails,rake}'
    - 'spec/cypress/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'
    # Frozen milestone specs and probes: their files are pinned by sha256 in the
    # acceptance criteria of each spec, so they are never rewritten for style.
    - 'docs/**/*'



