inherit_from: .rubocop_todo.yml

inherit_mode:
  merge:
    - Exclude

plugins:
  - rubocop-rails

Style/StringLiterals:
  Description: Checks if uses of quotes match the configured preference.
  StyleGuide: https://github.com/bbatsov/ruby-style-guide#consistent-string-literals
  Enabled: true
  EnforcedStyle: double_quotes
  SupportedStyles:
  - single_quotes
  - double_quotes

Style/HashSyntax:
  EnforcedShorthandSyntax: never


Rails/EnvironmentVariableAccess:
  AllowReads: true

# R9b (docs/specs/fork-updates-rubocop-plan.md, decision 2026-11-21): `a + b` and "#{a}#{b}" differ
# when b is not a String: `+` raises, interpolation calls to_s. The GraphQL controllers concatenate
# the client's operationName (an Array, Hash or number param raises TypeError, which both answer with
# an error) and Campaign#clone_newsletter concatenates name (a nameless campaign raises
# NoMethodError). Those behaviours stay; every other concatenation is interpolated.
Style/StringConcatenation:
  Exclude:
    - 'app/controllers/api/graphql_controller.rb'
    - 'app/controllers/graphql_controller.rb'
    - 'app/models/campaign.rb'

Lint/EmptyBlock:
  Exclude:
    - 'spec/**/*'
# R8 (docs/specs/fork-updates-rubocop-plan.md, owner decisions 2026-11-20, second batch): rake task
# files and the routes file are DSL blocks whose length is the list of tasks or routes they declare.
# config/** is outside AllCops too; the entry keeps the decision if config/ is ever linted.
# CountAsOne: see Metrics/MethodLength.
Metrics/BlockLength:
  CountAsOne: [array, hash, heredoc]
  Exclude:
  - 'spec/**/*'
  - 'lib/tasks/**/*'
  - 'config/routes.rb'

Style/OpenStructUse:
  Enabled: false
Style/AsciiComments:
  Enabled: false
Lint/MissingSuper:
  Enabled: false
Rails/SkipsModelValidations:
  Enabled: false
# R8 (same plan and decisions): Max is the length of app/models/concerns/user_handler.rb, the only
# module above the default 100 lines; it gets its own refactor milestone, after which Max goes down.
Metrics/ModuleLength:
  Max: 123
  Exclude:
    - app/services/message_apis/helpers.rb
Rails/InverseOf:
  Enabled: false
# Owner decisions 2026-11-20 (docs/specs/fork-updates-rubocop-plan.md, R7, second batch):
# format tokens stay unannotated ("%s"), the style the project writes; no code uses another style.
Style/FormatStringToken:
  EnforcedStyle: unannotated
# These five plugin files stay compact (`class A::B`): nested, `Twilio` in twilio_phone/api.rb would
# resolve to MessageApis::Twilio, and the four presenters evaluate ERB templates with
# `result(binding)`, whose constants no static check sees. Nesting them is risk without gain.
Style/ClassAndModuleChildren:
  Exclude:
    - 'app/services/message_apis/article_search/presenter.rb'
    - 'app/services/message_apis/calendly/presenter.rb'
    - 'app/services/message_apis/twilio_phone/api.rb'
    - 'app/services/message_apis/twilio_phone/presenter.rb'
    - 'app/services/message_apis/ui_catalog/presenter.rb'
# GraphQL type methods resolve schema fields of the same name (`online`, `owner`, ...); a `?` name
# would change the schema. R9a (same plan, decision 2026-11-21): Slack's receive_oauth_code (a plugin
# interface method: it fetches and stores an OAuth token) and TarDownloader#download_plugin (it
# downloads a plugin tarball and writes it to tmp/) return true/false but act; a `?` name would hide
# that. `call` is RuboCop's default.
Naming/PredicateMethod:
  AllowedMethods:
    - call
    - receive_oauth_code
    - download_plugin
  Exclude:
    - 'app/graphql/types/**/*'
# R9a (same plan, decision 2026-11-21): `Klass === obj` is Ruby's type check (what `case`/`when`
# does); every other `===` in the code is written `==`.
Style/CaseEquality:
  AllowOnConstant: true
# PluginSchemaValidator is one validator built from 21 small schema node classes; a file per class
# would scatter it without making it clearer.
Style/OneClassPerFile:
  Exclude:
    - 'app/services/plugin_schema_validator.rb'
# Owner decision 2026-11-20 (docs/specs/fork-updates-rubocop-plan.md, R7): stub class comments
# ("# Class for X") carry no information; classes are documented where it matters (GraphQL schema,
# README, specs).
Style/Documentation:
  Enabled: false
# Owner decision 2026-11-20 (same plan, R7): get_x/set_x names are part of public interfaces
# (GraphQL resolvers, plugin and integration APIs); renaming them breaks plugins and integrations.
Naming/AccessorMethodName:
  Enabled: false
# Owner decision 2026-11-20 (same plan, R7): parameter names of public methods are kept as they are
# (short names mirror external APIs); renaming them breaks plugins and integrations.
Naming/MethodParameterName:
  Enabled: false
# Owner decision 2026-11-20 (same plan, R6): keyword argument names are part of the plugin and
# integration interfaces (callers pass them by name), so an unused keyword argument stays as it is;
# unused positional arguments get a `_` prefix instead.
Lint/UnusedMethodArgument:
  AllowUnusedKeywordArguments: true
# R2b (same plan, owner decisions 2026-11-20): in ApiController the memoized ivars of get_user_data
# (@user_data) and get_app_user (@app_user) are state that other methods and subclasses also set and
# read (get_user_data_from_auth, set_locale, Api::GraphqlController#auth and attr_reader :user_data);
# naming them after the methods would split that state. App#availability is renamed instead.
Naming/MemoizedInstanceVariableName:
  Exclude:
    - 'app/controllers/api_controller.rb'
# R8 (same plan and decisions): metric limits at the level common in Rails projects, chosen from the
# distribution measured in the plan. Methods and classes above them are outliers: they stay listed in
# .rubocop_todo.yml and get refactor milestones with tests (docs/specs/fork-updates-r8a.md).
# R10cfg (docs/specs/fork-updates-r10-programme.md, decision K1 2026-11-22): a multi-line array, hash
# or heredoc literal counts as one line in MethodLength, ClassLength and BlockLength. Those literals
# are declarative data (plugin definition_info, messenger presenter schemas, provider fixtures);
# their length is not complexity, and splitting a schema into methods only scatters it. AbcSize and
# the complexity cops still measure the logic. Multi-line method calls still count line by line.
Metrics/MethodLength:
  Max: 30
  CountAsOne: [array, hash, heredoc]
Metrics/AbcSize:
  Max: 30
Metrics/CyclomaticComplexity:
  Max: 13
Metrics/PerceivedComplexity:
  Max: 13
Metrics/ParameterLists:
  Max: 7
# Integration adapters (app/services/message_apis/**) are one class per provider API: their length
# follows the API they wrap.
Metrics/ClassLength:
  Max: 300
  CountAsOne: [array, hash, heredoc]
  Exclude:
    - 'app/services/message_apis/**/*'
# A URL or a base64 blob cannot be wrapped. A line may run past Max only when such a token starts
# within the first 139 columns and runs to the end of the line (closing quotes and brackets aside);
# this extends AllowURI to quoted URLs. Base64: 40+ characters of its alphabet with a digit, an
# upper- and a lower-case letter.
Layout/LineLength:
  Max: 140
  AllowedPatterns:
    - '\A.{0,139}https?://[^\s"''`<>]+["''`]?[\s,;)\]}]*\z'
    - '\A.{0,139}(?=[A-Za-z0-9+/]*\d)(?=[A-Za-z0-9+/]*[A-Z])(?=[A-Za-z0-9+/]*[a-z])[A-Za-z0-9+/]{40,}={0,2}["'']?[\s,;)\]}]*\z'
AllCops:
  NewCops: enable
  Exclude:
    - 'node_modules/**/*'
    - 'db/**/*'
    - 'config/**/*'
    - 'script/**/*'
    - 'bin/{rails,rake}'
    - 'spec/cypress/**/*'
    - 'tmp/**/*'
    - 'vendor/**/*'
    # Frozen milestone specs and probes: their files are pinned by sha256 in the
    # acceptance criteria of each spec, so they are never rewritten for style.
    - 'docs/**/*'



