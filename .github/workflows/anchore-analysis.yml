name: Container Image CI

on:
  push:
    branches-ignore:
      - main
      - master
      - l10n_master2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v7

      - name: Build the Container image
        run: |
          docker build --build-arg APP_ENV=production \
               --build-arg NODE_ENV=production \
               --build-arg RUBY_VERSION=3.3.14 \
               --build-arg PG_MAJOR=15 \
               --build-arg NODE_MAJOR=26 \
               --build-arg YARN_VERSION=1.13.0 \
               --build-arg BUNDLER_VERSION=2.4.10 \
               --file Dockerfile \
               --tag localbuild/testimage:latest \
               .

      - uses: anchore/scan-action@v7
        id: scan
        with:
          image: 'localbuild/testimage:latest'
          fail-build: false
          output-format: sarif

      - name: upload Anchore scan SARIF report
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scan.outputs.sarif }}
