name: Create and publish a Docker image to ghcr.io

# The image is published only for commits that passed the test suite:
# - branch pushes: after the CI workflow (ruby.yml) completes successfully;
# - releases and manual runs: after checking that CI passed for the same commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - master
      - main
      - stage
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    # CI runs on every push; only a successful push run of this repository
    # (not a fork) publishes an image
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # up to 75 minutes waiting for CI (releases) plus the image build
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      actions: read

    steps:
      # In a workflow_run event github.sha and github.ref point at the default
      # branch head, not at the tested commit, so the source is resolved here.
      - name: Resolve source commit
        id: src
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_run ]; then
            sha="$RUN_SHA"; branch="$RUN_BRANCH"
          else
            sha="$GITHUB_SHA"; branch=""
            if [ "$REF_TYPE" = branch ]; then branch="$REF_NAME"; fi
          fi
          {
            echo "sha=$sha"
            echo "short_sha=${sha:0:7}"
            echo "branch=$branch"
            # Docker tags allow only [A-Za-z0-9_.-] (not leading . or -), max 128
            echo "branch_tag=$(printf '%s' "$branch" | sed -e 's/[^A-Za-z0-9_.-]/-/g' -e 's/^[.-]/_/' | cut -c1-128)"
          } >> "$GITHUB_OUTPUT"

      - name: Require a successful CI run for the commit
        if: github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.src.outputs.sha }}
        # A release is often published right after the push, while CI for the
        # commit is still queued or running (or not created yet): wait for it.
        timeout-minutes: 80
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ruby.yml/runs?head_sha=$SHA&event=push&per_page=100"
          start=$(date +%s)
          while :; do
            total=$(gh api "$runs" --jq '.total_count')
            pending=$(gh api "$runs" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            elapsed=$(( $(date +%s) - start ))
            if [ "$pending" -eq 0 ] && { [ "$total" -gt 0 ] || [ "$elapsed" -ge 300 ]; }; then
              break
            fi
            if [ "$elapsed" -ge 4500 ]; then
              echo "::error::CI for $SHA still not finished after 75 minutes"
              exit 1
            fi
            echo "waiting for CI on $SHA (runs: $total, unfinished: $pending)"
            sleep 30
          done
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ruby.yml/runs?head_sha=$SHA&status=success&event=push&per_page=1" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful CI run for $SHA; push the commit to a branch and let CI pass first"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.src.outputs.sha }}

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Branch builds: <branch> and sha-<short>. Releases (tag vX.Y.Z):
      # X.Y.Z, X.Y, X (not for pre-releases).
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # no automatic latest: a patch release of an older line must not
          # move it (GHCR had no latest tag before either)
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ steps.src.outputs.branch_tag }},enable=${{ steps.src.outputs.branch != '' }}
            type=raw,value=sha-${{ steps.src.outputs.short_sha }}
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}},enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.revision=${{ steps.src.outputs.sha }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            "APP_ENV=production"
            "NODE_ENV=production"
            "RUBY_VERSION=4.0.10"
            "PG_MAJOR=15"
            "NODE_MAJOR=26"
            "YARN_VERSION=1.13.0"
            "BUNDLER_VERSION=4.0.20"
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
