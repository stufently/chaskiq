name: Push Docker Image

on:
  push:
    branches:
      - master
      - main
      - stage
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # Docker Hub credentials are repository secrets; a fork without them skips
      # the job's steps instead of failing (the ghcr.io workflow builds the image).
      - name: Check Docker Hub credentials
        id: creds
        # only a true/false flag reaches this step; the secret values go to the
        # login step alone
        env:
          HAS_DOCKER_CREDS: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        run: |
          if [ "$HAS_DOCKER_CREDS" = true ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping Docker Hub push: secrets not set"
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.present == 'true'

      - name: Get Short SHA
        if: steps.creds.outputs.present == 'true'
        id: vars
        run: |
          echo "short_sha=$(git rev-parse --short=7 "$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Login into Registry
        if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image
        if: steps.creds.outputs.present == 'true'
        run: |
          docker build --build-arg APP_ENV=production \
               --build-arg RUBY_VERSION=4.0.10 \
               --build-arg PG_MAJOR=15 \
               --build-arg NODE_MAJOR=26 \
               --build-arg YARN_VERSION=1.13.0 \
               --build-arg BUNDLER_VERSION=4.0.20 \
               -t "$GITHUB_REPOSITORY" \
               .

      - name: Tag and Push Docker image
        if: steps.creds.outputs.present == 'true' && github.event_name == 'push'
        run: |
          docker tag "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY:$SHORT_SHA"
          docker push "$GITHUB_REPOSITORY:$SHORT_SHA"
          echo "SHORT_SHA: ${SHORT_SHA}"
        env:
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}

      - name: Tag LATEST and Push Docker image
        if: steps.creds.outputs.present == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY:latest"
          docker push "$GITHUB_REPOSITORY:latest"
          echo "LATEST deployed!"

      - name: Tag RELEASE and Push Docker image
        if: steps.creds.outputs.present == 'true' && github.event_name == 'release'
        # tag name goes through env, never into the script text (injection)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker tag "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY:$RELEASE_TAG"
          docker push "$GITHUB_REPOSITORY:$RELEASE_TAG"
          echo "$RELEASE_TAG deployed!"
