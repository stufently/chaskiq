name: Push Docker Image

# Same gating as docker-image-ghcr.yml: branch images only after the CI
# workflow (ruby.yml) passed for the commit; releases and manual runs check
# for a successful CI run of the same commit first.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - master
      - main
      - stage
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    # up to 75 minutes waiting for CI (releases) plus the image build
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read

    steps:
      # Docker Hub credentials are repository secrets; a fork without them skips
      # the job's steps instead of failing (the ghcr.io workflow builds the image).
      - name: Check Docker Hub credentials
        id: creds
        # only a true/false flag reaches this step; the secret values go to the
        # login step alone
        env:
          HAS_DOCKER_CREDS: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        run: |
          if [ "$HAS_DOCKER_CREDS" = true ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::skipping Docker Hub push: secrets not set"
          fi

      # In a workflow_run event github.sha and github.ref point at the default
      # branch head, not at the tested commit, so the source is resolved here.
      - name: Resolve source commit
        if: steps.creds.outputs.present == 'true'
        id: vars
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_run ]; then
            sha="$RUN_SHA"; branch="$RUN_BRANCH"
          else
            sha="$GITHUB_SHA"; branch=""
            if [ "$REF_TYPE" = branch ]; then branch="$REF_NAME"; fi
          fi
          {
            echo "sha=$sha"
            echo "short_sha=${sha:0:7}"
            echo "branch=$branch"
          } >> "$GITHUB_OUTPUT"

      - name: Require a successful CI run for the commit
        if: steps.creds.outputs.present == 'true' && github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.vars.outputs.sha }}
        # A release is often published right after the push, while CI for the
        # commit is still queued or running (or not created yet): wait for it.
        timeout-minutes: 80
        run: |
          runs="repos/$GITHUB_REPOSITORY/actions/workflows/ruby.yml/runs?head_sha=$SHA&event=push&per_page=100"
          start=$(date +%s)
          while :; do
            total=$(gh api "$runs" --jq '.total_count')
            pending=$(gh api "$runs" --jq '[.workflow_runs[] | select(.status != "completed")] | length')
            elapsed=$(( $(date +%s) - start ))
            if [ "$pending" -eq 0 ] && { [ "$total" -gt 0 ] || [ "$elapsed" -ge 300 ]; }; then
              break
            fi
            if [ "$elapsed" -ge 4500 ]; then
              echo "::error::CI for $SHA still not finished after 75 minutes"
              exit 1
            fi
            echo "waiting for CI on $SHA (runs: $total, unfinished: $pending)"
            sleep 30
          done
          passed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ruby.yml/runs?head_sha=$SHA&status=success&event=push&per_page=1" --jq '.total_count')
          if [ "$passed" -lt 1 ]; then
            echo "::error::no successful CI run for $SHA; push the commit to a branch and let CI pass first"
            exit 1
          fi

      - uses: actions/checkout@v7
        if: steps.creds.outputs.present == 'true'
        with:
          ref: ${{ steps.vars.outputs.sha }}

      - name: Login into Registry
        if: steps.creds.outputs.present == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build the Docker image
        if: steps.creds.outputs.present == 'true'
        run: |
          docker build --build-arg APP_ENV=production \
               --build-arg RUBY_VERSION=4.0.10 \
               --build-arg PG_MAJOR=15 \
               --build-arg NODE_MAJOR=26 \
               --build-arg YARN_VERSION=1.13.0 \
               --build-arg BUNDLER_VERSION=4.0.20 \
               -t "$GITHUB_REPOSITORY" \
               .

      - name: Tag and Push Docker image
        if: steps.creds.outputs.present == 'true' && github.event_name == 'workflow_run'
        run: |
          docker tag "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY:$SHORT_SHA"
          docker push "$GITHUB_REPOSITORY:$SHORT_SHA"
          echo "SHORT_SHA: ${SHORT_SHA}"
        env:
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}

      - name: Tag LATEST and Push Docker image
        if: steps.creds.outputs.present == 'true' && github.event_name == 'workflow_run' && steps.vars.outputs.branch == 'main'
        run: |
          docker tag "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY:latest"
          docker push "$GITHUB_REPOSITORY:latest"
          echo "LATEST deployed!"

      - name: Tag RELEASE and Push Docker image
        if: steps.creds.outputs.present == 'true' && github.event_name == 'release'
        # tag name goes through env, never into the script text (injection)
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          docker tag "$GITHUB_REPOSITORY" "$GITHUB_REPOSITORY:$RELEASE_TAG"
          docker push "$GITHUB_REPOSITORY:$RELEASE_TAG"
          echo "$RELEASE_TAG deployed!"
