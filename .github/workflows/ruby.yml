# .github/workflows/ci.yml
# Reproduce locally with bin/ci-local (same services and steps, in Docker).

name: CI
on:
  push:
    branches-ignore:
      - 'l10n_master2'
env:
  # ubuntu-26.04 ships GCC 15 (C23 by default); scout_apm 5.3.5's C extension
  # only builds as C17. Drop once scout_apm is upgraded.
  BUNDLE_BUILD__SCOUT_APM: "--with-cflags=-std=gnu17"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      db:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.10-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
      REDIS_URL: redis://localhost:6379/0
      RAILS_ENV: test
      RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
      APPSTORE_DB_URL: postgres://postgres:postgres@localhost:5432/test
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          # version comes from .ruby-version
          bundler-cache: true

      # keep node-version in sync with NODE_MAJOR in bin/ci-local
      - uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install JS dependencies
        # Node 26 ships without corepack/yarn; spec/support/graphql_queries.rb
        # shells out to `npx ts-node`
        run: |
          npm install -g yarn@1.22.22 ts-node@10.9.2
          yarn install --frozen-lockfile --non-interactive

      - name: Prepare database
        run: bundle exec rails db:prepare

      # The app store token is exposed only to the steps that download packages.
      - name: Check app store token
        id: appstore
        env:
          CHASKIQ_APPSTORE_TOKEN: ${{ secrets.CHASKIQ_APPSTORE_TOKEN }}
        run: |
          if [ -n "$CHASKIQ_APPSTORE_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CHASKIQ_APPSTORE_TOKEN not set, skipping app store packages and E2E"
          fi

      - name: Install app store packages
        # needs the upstream app store token; forks run the suite without them
        if: steps.appstore.outputs.present == 'true'
        env:
          CHASKIQ_APPSTORE_TOKEN: ${{ secrets.CHASKIQ_APPSTORE_TOKEN }}
        run: bundle exec rails packages:download_and_install["2.1.10"]

      - name: Run specs
        run: bundle exec rspec

      - name: Build and run E2E tests
        # records to upstream's Cypress Dashboard and needs the app store token
        if: github.repository == 'chaskiq/chaskiq' && steps.appstore.outputs.present == 'true'
        env:
          CHASKIQ_APPSTORE_TOKEN: ${{ secrets.CHASKIQ_APPSTORE_TOKEN }}
        run: |
          sudo apt-get update -qq
          sudo apt-get -yqq install libpq-dev curl
          bundle exec rake assets:precompile
          bundle exec rails packages:download_and_install["2.0.0-rc"]
          bundle exec rails server -e test -p 5002 -d
          ./node_modules/.bin/cypress install
          yarn cypress:ga-ci
