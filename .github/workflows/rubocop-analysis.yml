# pulled from repo
# Reproduce locally with: bin/ci-local --only rubocop
name: 'Rubocop'

on:
  push:
    branches: [main, master, '!l10n_master2']
  schedule:
    - cron: '27 22 * * 2'

jobs:
  rubocop:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Ruby version comes from .ruby-version
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Offenses (exit 1) go to code scanning and do not fail the job (known
      # backlog); a RuboCop error or crash (exit 2) does.
      - name: Rubocop run
        run: |
          rc=0
          bundle exec rubocop --require code_scanning --format progress \
            --format CodeScanning::SarifFormatter --out rubocop.sarif || rc=$?
          echo "rubocop exit code: $rc"
          [ "$rc" -le 1 ]

      - name: Upload Sarif output
        if: always() && hashFiles('rubocop.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: rubocop.sarif
